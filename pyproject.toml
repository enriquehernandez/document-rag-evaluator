[project]
name = "document-rag-evaluator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Enrique Hernández", email = "enrique.hernandez@basedos.cl" }
]
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-groq",
    "langchain-community",
    "chromadb",
    "ragas",
    "pypdf",
    "python-dotenv",
    "pydantic-settings",
    "rank_bm25",
    "pytest",
    "onnxruntime==1.16.0",  # <-- Fuerza esta versión para Mac Intel
    "langchain-text-splitters>=1.1.3",
]

# Cambiamos el backend a hatchling para que respete la carpeta 'app'
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ESTO ES LO IMPORTANTE: Decirle a uv dónde está el código
[tool.hatch.build.targets.wheel]
packages = ["app"]
