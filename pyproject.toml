[project]
name = "document-rag-evaluator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Enrique Hernández", email = "enrique.hernandez@basedos.cl" }
]
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-groq",
    "langchain-community<0.4",
    "chromadb",
    "ragas",
    "pypdf",
    "python-dotenv",
    "pydantic-settings",
    "rank_bm25",
    "pytest",
    "onnxruntime==1.16.0",  # <-- Fuerza esta versión para Mac Intel
    "langchain-text-splitters>=1.1.3",
    "datasets>=5.1.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.3",
]

# Cambiamos el backend a hatchling para que respete la carpeta 'app'
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ESTO ES LO IMPORTANTE: Decirle a uv dónde está el código
[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "tomlscript>=0.2.1",
]

[tool.pytest.ini_options]
# addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-report=xml"
addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-report=xml --junitxml=junit.xml -o junit_family=legacy"

[tool.tomlscript]
# Levantar el servidor en el puerto 8000
dev = "uv run uvicorn app.main:app --reload --port 8000"

# Correr todos los tests con cobertura
test = "uv run pytest tests/ "

# Correr solo un test específico (por ejemplo, el de la API)
test-api = "uv run pytest tests/test_api.py -v"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:"
]
