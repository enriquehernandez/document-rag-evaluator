name: Test workflow

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Test python API
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true # Almacena en caché las dependencias automáticamente

    - name: Install dependencies
      run: |
        uv sync --all-extras --dev

    - name: Run tests with coverage
      run: |
        uv run pytest --cov=./ --cov-report=xml

    - name: Upload coverage to Codecov with GitHub Action
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        fail_ci_if_error: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        # token: ${{ secrets.CODECOV_TOKEN }} # Requerido para repositorios privados (y recomendado para públicos)
        
